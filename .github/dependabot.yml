version: 2
updates:
  # Workflows in .github/workflows and the composite action in cli/action.yml.
  - package-ecosystem: github-actions
    directories:
      - /
      - /cli
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: gomod
    directory: /cli
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns:
          - "*"

  # Base images of the CLI image.  The extension image is parameterized by
  # PG_MAJOR (postgres:${PG_MAJOR}), which Dependabot cannot update.
  - package-ecosystem: docker
    directory: /cli
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  # MkDocs for the documentation site.
  - package-ecosystem: pip
    directory: /
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
