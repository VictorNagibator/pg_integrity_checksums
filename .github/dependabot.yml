version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: gomod
    directory: /cli
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /cli
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
