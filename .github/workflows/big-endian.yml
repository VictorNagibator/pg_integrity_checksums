name: Big-endian

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: big-endian-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-s390x:
    name: Linux s390x / PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: s390x

      - name: Test on big-endian s390x
        run: |
          docker run --rm --platform linux/s390x \
            -v "$PWD:/src" -w /src \
            debian:bookworm \
            bash -c '
              set -e
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates curl build-essential bison flex libipc-run-perl
              useradd -m pg
              chown -R pg /src
              su pg -c "sh /src/.github/scripts/big-endian-s390x.sh"
            '
