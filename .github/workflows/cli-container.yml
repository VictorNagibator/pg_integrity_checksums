# Build the standalone CLI container when a cli-v* tag is pushed.
name: CLI Container

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cli-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build CLI image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Clean version
        id: version
        shell: bash
        run: echo "clean=${GITHUB_REF_NAME#cli-v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: cli
          file: cli/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.clean }}
          tags: |
            ghcr.io/victornagibator/pg_integrity_checksums-cli:${{ github.ref_name }}
            ghcr.io/victornagibator/pg_integrity_checksums-cli:latest
