name: CLI Docker

on:
  push:
    paths:
      - "cli/**"
      - ".github/workflows/cli-docker.yml"
  pull_request:
    paths:
      - "cli/**"
      - ".github/workflows/cli-docker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Docker CLI smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build CLI image
        run: docker build -t pgics-cli ./cli
      - name: Smoke test CLI image
        run: |
          docker run --rm pgics-cli version
          docker run --rm pgics-cli completion bash >/dev/null
