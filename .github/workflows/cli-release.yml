# Tag cli-v* to build platform binaries and publish release notes from cli/Changes.
name: CLI Release

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: write

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish CLI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: freebsd
            goarch: amd64
            ext: ""
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Build
        working-directory: cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
          VERSION: ${{ github.ref_name }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          VERSION_CLEAN=$(printf '%s' "$VERSION" | sed 's/^cli-v//')
          go build -trimpath -ldflags "-s -w -X github.com/VictorNagibator/pg_integrity_checksums/cli/internal/cli.Version=$VERSION_CLEAN" -o "dist/pg_integrity_checksums-$VERSION-$GOOS-$GOARCH$EXT" ./cmd/pg_integrity_checksums
          sha256sum dist/* > "dist/SHA256SUMS-$GOOS-$GOARCH.txt"
      - name: Build release notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION_CLEAN=$(printf '%s' "$VERSION" | sed 's/^cli-v//')
          python3 .github/scripts/changelog_for_version.py "$VERSION_CLEAN" cli/Changes > cli/release-notes.md

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: pg_integrity_checksums CLI ${{ github.ref_name }}
          body_path: cli/release-notes.md
          files: cli/dist/*
