coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
        informational: true
    patch:
      default:
        target: 70%
        informational: true

flags:
  unit:
    carryforward: true
  integration:
    carryforward: true

ignore:
  - "cli/cmd/**"

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
